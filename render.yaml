services:
  - type: web
    name: construction-inventory
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: construction-inventory
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: construction-inventory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: construction-inventory-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: construction-inventory-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: construction-inventory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: construction-inventory-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: construction-inventory-db
    databaseName: construction_inventory
    user: laravel
